<!doctype html><html lang="en"><meta charset="utf-8"><title>Mockup state backup and restore</title><style>body{font:15px/1.6 system-ui;max-width:680px;margin:60px auto;padding:20px;color:#183e42}button{padding:12px 18px;margin:10px 8px 10px 0;cursor:pointer}pre{white-space:pre-wrap;background:#f0f6f4;padding:16px}a{color:#096f6b}</style><h1>Mockup state backup and restore</h1><p>This tool exports only the three listing-mockup storage keys on this origin. It does not access production data. Restore replaces those keys, including removing any key absent in the backup.</p><button id="export">Export mockup state</button><input id="file" type="file" accept="application/json"><button id="restore">Restore selected backup</button><pre id="status" role="status">No action taken.</pre><a href="editor.html">Return to the editor</a><script>
const keys=['v3-listing-sidebar-v2','v3-linked-studio-demo','buildographic-listing-workflow-v1'];
if(new URLSearchParams(location.search).has('checkpoint')){const data={origin:location.origin,exportedAt:new Date().toISOString(),values:Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]))};fetch('http://127.0.0.1:5196/checkpoint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data,null,2)}).then(async response=>{const result=await response.json();if(!response.ok||!result.verified)throw Error(result.error||'Backup failed');document.querySelector('#status').textContent='Browser checkpoint saved and verified. SHA-256: '+result.sha256;}).catch(error=>document.querySelector('#status').textContent=error.message);}
document.querySelector('#export').onclick=()=>{const data={origin:location.origin,exportedAt:new Date().toISOString(),values:Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]))};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='listing-mockup-browser-state.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#status').textContent='Exported '+keys.filter(k=>data.values[k]!==null).length+' saved mockup keys from '+location.origin;};
document.querySelector('#restore').onclick=async()=>{try{const f=document.querySelector('#file').files[0];if(!f)throw Error('Choose a backup JSON file first.');const data=JSON.parse(await f.text());if(data.origin!==location.origin)throw Error('Open this tool on '+data.origin+' to restore that origin.');if(!data.values||keys.some(k=>!(k in data.values)||data.values[k]!==null&&typeof data.values[k]!=='string'))throw Error('Invalid mockup backup.');for(const k of keys){if(data.values[k]!==null)JSON.parse(data.values[k]);}const before=Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]));try{for(const k of keys){if(data.values[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,data.values[k]);}}catch(err){for(const k of keys){if(before[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,before[k]);}throw err;}document.querySelector('#status').textContent='Restored mockup keys. Reload the editor to use the restored state.';}catch(err){document.querySelector('#status').textContent=err.message;}};
</script></html>
