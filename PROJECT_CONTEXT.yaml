# ─── AC Coverage Requirements (v0.4.0+) ──────────────────────────────────────
# Defines which Acceptance Criteria types are required per domain before a story
# can be locked for implementation. `orion run harden` reads this section.
#
# Built-in types: happy-path, error-path, security, session-expiry,
#   idempotency, currency-edge, rate-limit, null-input, concurrent,
#   rollback, offline, edge-case
#
# Rule: default types apply to every story. per_domain entries are additive.
# ─────────────────────────────────────────────────────────────────────────────
ac_coverage:
  # Required for every story regardless of domain:
  default: [happy-path, error-path]

  # Per-domain additions — uncomment and extend for your project:
  per_domain:
    # AI stories consistently carry two risks the defaults miss:
    #  - regression: every AI story touches a shared generation pipeline whose
    #    existing guarantees (e.g. verifyAndRepairV4JsonPrompt, 23 tests) must survive
    #  - edge-case: model output is non-deterministic, so partial/degenerate responses
    #    are the normal case rather than an exception
    # Set 2026-08-11 during the EPIC-AI-06 harden pass — per_domain was {} until then,
    # meaning AI stories were certified against only [happy-path, error-path].
    AI: [regression, edge-case]
    # PAY stories move money and apply discounts — the defaults miss both risks:
    #  - security: never trust a client-computed discounted amount; server resolves
    #    the effective price and passes offer_id to Razorpay, never the reverse
    #  - currency-edge: paise/rupee rounding, negative/zero amounts, discount stacking
    # Set 2026-08-21 during EPIC-PAY-05 (Pricing Relaunch) roadmap generation.
    PAY: [security, currency-edge]
    # INFRA stories move bytes to a third party and then write a URL to the DB. The
    # defaults miss the two failure modes that produces:
    #  - rollback: the two writes are not atomic. Upload succeeds, DB write fails ->
    #    an orphaned object. DB write succeeds, upload failed -> a persisted URL
    #    pointing at nothing. "The provider call failed" (error-path) is a different,
    #    easier case and is the only one the defaults force you to think about.
    #  - concurrent: the chat flow sends variations: 3, so uploads run in parallel.
    #    All-succeed is happy-path and all-fail is error-path; PARTIAL failure is
    #    neither, and it is the case that decides what the customer actually gets.
    # Set 2026-08-31 while hardening EPIC-INFRA-02 — per_domain.INFRA was absent until
    # then, so all three storage stories certified against only [happy-path, error-path].
    INFRA: [rollback, concurrent]
    # ORG stories decide who may act on whose data. The defaults would certify a
    # permission change against happy-path and error-path alone, which is exactly how
    # US-ORG-001's defect shipped: removeUserFromOrganization validates the TARGET and
    # never the CALLER, and both of those types pass.
    ORG: [security, rollback]
  # per_domain:
  #   DESIGN: []    # add: security, session-expiry, idempotency, currency-edge, rate-limit, null-input, concurrent, rollback, offline, edge-case
  #   PAY: []    # add: security, session-expiry, idempotency, currency-edge, rate-limit, null-input, concurrent, rollback, offline, edge-case
  #   AUTH: []    # add: security, session-expiry, idempotency, currency-edge, rate-limit, null-input, concurrent, rollback, offline, edge-case
