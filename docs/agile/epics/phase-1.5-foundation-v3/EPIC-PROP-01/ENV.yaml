version: 1
epic: EPIC-PROP-01
status: planning-reconciled
runtime:
  frontend: http://localhost:5000
  api: http://localhost:3001
  editor: existing opt-in V3 route
required_environment_names:
  - DATABASE_URL
  - JWT_SECRET
secrets: use existing local configuration; never write values to stories or logs
database:
  orm: Prisma 6
  schema: api/prisma/schema.prisma
  migration: additive Property and ListingProfile; generate and validate source before live deployment
  ownership: Property organization from JWT; ListingProfile user from JWT
  concurrency: expectedVersion atomic compare-and-increment
providers: none; no MLS/RERA/AI credentials required by this slice
gates:
  gate1: [npm run check, npm run test:unit]
  gate2: actual V3 375px and 1440px; light/dark; keyboard; no console errors
  gate3: npx playwright test e2e/v3-listing-workflow.spec.ts
  gate4: authenticated property/profile HTTP success; 401; cross-org 404; stale 409; large body
risks:
  - Existing V3 work remains on a dependent branch; preserve runtime and route selection.
  - Live migration and database smoke require reachable configured DB; record actual outcome.
  - Manual photos may enlarge JSON; route-scoped bounded parsing must be verified.
