# Environment variables required by EPIC-INFRA-02
# Update this file as you discover required env vars during implementation.
# Production values set in Railway dashboard.

epic: EPIC-INFRA-02

required:
  - name: R2_ACCOUNT_ID
    description: "Cloudflare account ID that owns the R2 bucket"
    example: "a1b2c3d4e5f6..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: R2_ACCESS_KEY_ID
    description: "R2 API token access key (S3-compatible auth)"
    example: "..."
    set_in: ".env (local, gitignored) | Railway env vars (production)"
  - name: R2_SECRET_ACCESS_KEY
    description: "R2 API token secret key"
    example: "..."
    set_in: ".env (local, gitignored) | Railway env vars (production)"
  - name: R2_BUCKET_NAME
    description: "Bucket that holds generated infographics, composed designs, source photos"
    example: "buildographic-assets"
    set_in: ".env (local) | Railway env vars (production)"
  - name: R2_PUBLIC_URL
    description: "Public base URL assets are served from (custom domain fronted by Cloudflare CDN)"
    example: "https://assets.buildographic.com"
    set_in: ".env (local) | Railway env vars (production)"
