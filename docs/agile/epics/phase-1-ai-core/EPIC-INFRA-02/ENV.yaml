# Environment variables required by EPIC-INFRA-02
#
# ⚠️ THREE environments, not two. An earlier version of this file said
# ".env (local) | Railway env vars (production)" on every var and never mentioned
# staging. Implementing against that leaves staging either unconfigured or — far more
# likely, because someone copies the values that work — pointed at the PRODUCTION
# bucket, where a staging bug writes into assets real customers are being served.
#
# Unlike RazorPay, nothing stops that happening. RazorPay has test and live modes as
# separate namespaces, and a boot guard that aborts if a live key appears outside
# production. R2 has no equivalent: one bucket can serve every environment, and the
# credentials look identical. Separation here is a choice we make and then defend,
# not something the provider enforces.
#
# Two things defend it:
#   1. Per-bucket API token scoping (below) — a staging token that physically cannot
#      reach the production bucket.
#   2. The boot guard in US-INFRA-001 AC6 — refuses to start if a non-production
#      environment is pointed at a bucket without a staging marker.

epic: EPIC-INFRA-02

# ---------------------------------------------------------------------------
# Human prerequisite — Cloudflare dashboard, before US-INFRA-001 can start.
# Tracked as HUMAN_TASKS #5. Blocks the story STARTING, not just finishing:
# no AI agent can self-provision third-party cloud credentials.
# ---------------------------------------------------------------------------
human_setup:
  - "Enable R2 on the Cloudflare account (needs a payment method even within the free allowance)"
  - "Create TWO buckets: buildographic-assets (production) and buildographic-assets-staging"
  - "Create TWO R2 API tokens, each SCOPED TO ITS OWN BUCKET with Object Read & Write.
     This scoping is the substitute for RazorPay's mode guard — R2_ACCOUNT_ID is shared
     between environments, so an unscoped production token would work perfectly well from
     staging. The bucket scope is the only thing standing between the two."
  - "Note the Account ID (one per Cloudflare account — the same value in both environments)"
  - "Public access — production: attach the custom domain assets.buildographic.com"
  - "Public access — staging: enable the managed r2.dev subdomain. DECIDED 2026-08-30: staging
     gets NO custom domain. Cloudflare rate-limits r2.dev and does not recommend it for
     production traffic, which is exactly why it suits staging — and it saves a second DNS
     record plus a second certificate to keep alive for an environment nobody outside the team
     ever loads."
  - "DNS: assets.buildographic.com -> production bucket. Attaching a custom domain to a
     bucket in the same Cloudflare account wires the record automatically (buildographic.com
     was purchased 2026-07-17 and is on this account)"
  - "CORS: only needed if the browser fetches asset URLs directly rather than through the API"

required:
  - name: R2_ACCOUNT_ID
    description: "Cloudflare account ID that owns the R2 buckets. Also forms the S3 endpoint:
                  https://<R2_ACCOUNT_ID>.r2.cloudflarestorage.com"
    scope: shared
    local: "<cloudflare-account-id>"
    staging: "<same as local/production — one account>"
    production: "<same>"
    set_in: ".env (local) | Railway env vars (staging AND production)"
    note: "The ONLY shared var in this block. Because it is shared, it provides no isolation
           on its own — see the token scoping note above."

  - name: R2_ACCESS_KEY_ID
    description: "R2 API token access key (S3-compatible auth)"
    scope: per-env
    local: "<staging-token — do not put a production token in a local .env>"
    staging: "<staging-scoped token>"
    production: "<production-scoped token>"
    set_in: ".env (local, gitignored) | Railway env vars (staging AND production)"

  - name: R2_SECRET_ACCESS_KEY
    description: "R2 API token secret key"
    scope: per-env
    local: "<staging token secret>"
    staging: "<staging token secret>"
    production: "<production token secret>"
    set_in: ".env (local, gitignored) | Railway env vars (staging AND production)"
    note: "Never log, never commit. Shown once at token creation in the Cloudflare dashboard."

  - name: R2_BUCKET_NAME
    description: "Bucket that holds generated infographics, composed designs, source photos"
    scope: per-env
    local: "buildographic-assets-staging"
    staging: "buildographic-assets-staging"
    production: "buildographic-assets"
    set_in: ".env (local) | Railway env vars (staging AND production)"
    note: "US-INFRA-001 AC6's boot guard reads this. Keep the literal substring 'staging' in
           every non-production bucket name — the guard matches on it."

  - name: R2_PUBLIC_URL
    description: "Public base URL assets are served from. StorageService.getPublicUrl()
                  concatenates this with the object key, so a wrong value here produces URLs
                  that 404 rather than an error anyone notices at write time."
    scope: per-env
    local: "https://<staging-bucket>.<account>.r2.dev"
    staging: "https://<staging-bucket>.<account>.r2.dev"
    production: "https://assets.buildographic.com"
    set_in: ".env (local) | Railway env vars (staging AND production)"
    note: "No trailing slash — getPublicUrl joins with '/'. Staging and local share the r2.dev
           hostname because they share the staging bucket; only production has a custom domain."

# ---------------------------------------------------------------------------
# Verification, after setting these on either Railway environment.
# Per docs/setup/ENV_SINGLE_SOURCE_OF_TRUTH.md step 4: do not trust the dashboard,
# pull the values back.
# ---------------------------------------------------------------------------
verify:
  - "railway variables --environment staging --kv | grep R2_"
  - "railway variables --environment production --kv | grep R2_"
  - "Confirm R2_BUCKET_NAME differs between the two, and that R2_PUBLIC_URL points at the
     matching bucket's public hostname"
