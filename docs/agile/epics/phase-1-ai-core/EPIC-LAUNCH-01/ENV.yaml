# Environment variables required by EPIC-LAUNCH-01
# Update this file as you discover required env vars during implementation.
# Production values set in Railway dashboard.

epic: EPIC-LAUNCH-01

required:
  - name: RESEND_API_KEY
    description: "Resend API key for transactional email (US-LAUNCH-002). Absent locally → EmailService logs to console instead of sending."
    example: "re_xxxxxxxxxxxx"
    set_in: "Railway env vars (production); optional in local .env"
  - name: EMAIL_FROM
    description: "From address for all transactional email (verified domain in Resend)"
    example: "InfographicAI <no-reply@infographicai.example>"
    set_in: ".env (local) | Railway env vars (production)"
  - name: BETA_MODE
    description: "true → paid checkout disabled server-side (403 on subscription create) — US-LAUNCH-004"
    example: "true"
    set_in: "Railway env vars (production)"
  - name: VITE_BETA_MODE
    description: "true → pricing page shows beta messaging, checkout buttons replaced — US-LAUNCH-004"
    example: "true"
    set_in: "Railway env vars (production, build-time)"
  - name: RAZORPAY_KEY_ID
    description: "LIVE mode key (rzp_live_*) in production — US-LAUNCH-005. Startup assert fails prod boot on rzp_test_*."
    example: "rzp_live_xxxxxxxx"
    set_in: "Railway env vars (production) — keep rzp_test_* in local .env"
  - name: RAZORPAY_KEY_SECRET
    description: "LIVE mode secret in production — US-LAUNCH-005"
    set_in: "Railway env vars (production)"
  - name: RAZORPAY_WEBHOOK_SECRET
    description: "Secret of the LIVE webhook created for https://{prod-domain}/api/v1/webhooks/razorpay — US-LAUNCH-005"
    set_in: "Railway env vars (production)"
  - name: VITE_RAZORPAY_KEY_ID
    description: "LIVE public key exposed to browser checkout — US-LAUNCH-005"
    example: "rzp_live_xxxxxxxx"
    set_in: "Railway env vars (production, build-time)"
  - name: RAZORPAY_PLAN_SOLO_MONTHLY
    description: "LIVE plan ID (plans do NOT carry over from test mode — recreate in live dashboard) — US-LAUNCH-005"
    example: "plan_live_xxxxxxxx"
    set_in: "Railway env vars (production)"
  - name: RAZORPAY_PLAN_SOLO_ANNUAL
    description: "LIVE plan ID — US-LAUNCH-005"
    set_in: "Railway env vars (production)"
  - name: RAZORPAY_PLAN_TEAM_MONTHLY
    description: "LIVE plan ID (₹6,999 / 699900 paise — PT-05 verified in test mode; re-verify in live) — US-LAUNCH-005"
    set_in: "Railway env vars (production)"
  - name: RAZORPAY_PLAN_TEAM_ANNUAL
    description: "LIVE plan ID — US-LAUNCH-005"
    set_in: "Railway env vars (production)"
  - name: TRUSTED_PROXY_HOPS
    description: >-
      Number of proxies between the browser and NestJS (US-LAUNCH-014 AC11).
      ProxyAwareThrottlerGuard counts this many x-forwarded-for entries back from the RIGHT;
      leftmost entries are client-supplied and must never be trusted. Defaults to 1 when unset.
      local dev = 1 (Express proxy only); Railway = likely 2 (Railway edge + Express) — confirm
      on staging by logging the header once (MV-014-06) before relying on the AC12 limits.
    example: "1"
    set_in: ".env (local) | Railway env vars (staging + production)"
  - name: INTERNAL_TEST_EMAIL_DOMAINS
    description: >-
      Comma-separated DOMAIN allowlist for internal test accounts (US-LAUNCH-014 AC14).
      Exact domain equality only — evil-test.local and sub.test.local do NOT match test.local.
      A matching address registers pre-verified (no verification token or email), skips the
      disposable-domain check, and is exempt from the per-IP limits on register /
      resend-verification / forgot-password. Nothing else changes: no auth bypass, no free
      credits, no exemption from EmailVerifiedGuard for other users, the monthly plan limit
      or the global 100/min throttle. Every hit logs once at `warn`.
      Unset or empty → the feature is inert and the API behaves exactly as without it.
    example: "test.local"
    set_in: >-
      .env (local = test.local) | Railway staging = test.local plus a domain the team controls |
      PRODUCTION: leave UNSET — anyone who controls or can claim an allowlisted domain would
      obtain verified, unthrottled accounts. Production test accounts are seeded directly via
      `npm run seed:test-users` (writes through Prisma, does not read this variable).
  - name: TEST_USER_EMAIL
    description: >-
      Fixed account seeded by `npm run seed:test-users` (US-LAUNCH-014 AC17) so smoke tests
      LOG IN rather than register. The seed script writes via Prisma with emailVerified: true
      and never depends on INTERNAL_TEST_EMAIL_DOMAINS.
    example: "smoke@buildographic.com"
    set_in: ".env (local) | Railway env vars (staging + production, if smoke tests run there)"
  - name: TEST_USER_PASSWORD
    description: "Password for the seeded TEST_USER_EMAIL account (bcrypt-hashed on write) — US-LAUNCH-014 AC17"
    set_in: ".env (local) | Railway env vars (staging + production, if smoke tests run there)"
