# Environment variables required by EPIC-PAY-05
# Update this file as you discover required env vars during implementation.
# Production values set in Railway dashboard.

epic: EPIC-PAY-05

required:
  - name: RAZORPAY_PLAN_PRO_MONTHLY
    description: "Razorpay Plan ID for the new PRO tier, monthly billing (human-created in dashboard)"
    example: "plan_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_PLAN_PRO_ANNUAL
    description: "Razorpay Plan ID for PRO, annual billing — price computed via the ×10 standing discount formula, NOT the current codebase's ×12×0.85"
    example: "plan_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_PLAN_AGENCY_MONTHLY
    description: "Razorpay Plan ID for the new AGENCY tier, monthly billing (replaces BROKERAGE in the public plan lineup — different volume, 1000 vs 400/mo, not a rename)"
    example: "plan_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_PLAN_AGENCY_ANNUAL
    description: "Razorpay Plan ID for AGENCY, annual billing"
    example: "plan_..."
    set_in: ".env (local) | Railway env vars (production)"
  # ── Promo Plan objects — the mechanism that actually shipped ──────────────
  #
  # Added 2026-09-07 (US-PAY-110 Env pillar). The RAZORPAY_OFFER_* entries below
  # document Razorpay **Offers**, which the 2026-08-27 rescope replaced and which
  # no code path reads. A Razorpay Plan is price-immutable, so a promotional
  # price cannot be a discount on an existing Plan — it has to be its own Plan
  # object. `payments.service.ts:185` resolves it by convention.
  - name: "RAZORPAY_PLAN_<TIER>_<INTERVAL>_<CAMPAIGN_CODE>"
    description: >-
      Razorpay Plan ID for one tier/interval under one campaign — the promotional
      price as its own Plan object. TIER is the plan tier (SOLO, PRO, TEAM,
      AGENCY), INTERVAL is MONTHLY or ANNUAL, and CAMPAIGN_CODE is the campaign
      code upper-cased with every non-alphanumeric character replaced by "_".
      Resolved at checkout by getPlanId() in payments.service.ts. When it is
      unset the checkout is REFUSED with PROMO_PLAN_NOT_CONFIGURED rather than
      falling back to the list-price Plan, which would charge the customer more
      than the price the page advertised (US-PAY-110 AC3).
    example: "RAZORPAY_PLAN_SOLO_ANNUAL_FOUNDING100=plan_..."
    set_in: ".env (local) | Railway env vars (production)"
    required: "Only for tiers/intervals a live campaign actually covers"

  # ⚠️ SUPERSEDED 2026-08-27 — the four RAZORPAY_OFFER_* vars below describe the
  # Razorpay Offers mechanism, dropped when pricing moved to "a promotion is a
  # price, not a discount". Nothing reads them (grep-confirmed 2026-09-07); the
  # promo Plan pattern above replaced them. Kept, not deleted, so the change of
  # mechanism stays legible — US-PAY-108 is closed as superseded for the same
  # reason. Do not set these; they have no effect.
  - name: RAZORPAY_OFFER_FOUNDING_SOLO
    description: "SUPERSEDED (see note above). Razorpay Offer ID for the Founding Customer 100 campaign on SOLO — the Offers mechanism was replaced by promo Plan objects; unread by any code path."
    example: "offer_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_OFFER_FOUNDING_PRO
    description: "Razorpay Offer ID for the Founding Customer 100 campaign on PRO (~27.3% off)"
    example: "offer_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_OFFER_FOUNDING_TEAM
    description: "Razorpay Offer ID for the Founding Customer 100 campaign on TEAM (~31.8% off)"
    example: "offer_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_OFFER_FOUNDING_AGENCY
    description: "Razorpay Offer ID for the Founding Customer 100 campaign on AGENCY (~31.8% off)"
    example: "offer_..."
    set_in: ".env (local) | Railway env vars (production)"

notes:
  - "No new secrets categories — these are Razorpay Plan/Offer IDs, same sensitivity class as the existing RAZORPAY_PLAN_* vars already documented in docs/payments/RAZORPAY_SETUP_GUIDE.md."
  - "PricingCampaign.tierDiscounts (Prisma JSON column, US-PAY-105) stores these offer IDs per campaign — env vars here are only the Founding-100 campaign's initial values; future campaigns (festival, etc.) get their own offer IDs stored as DB rows, not new env vars."
