# Environment variables required by EPIC-PAY-05
# Update this file as you discover required env vars during implementation.
# Production values set in Railway dashboard.

epic: EPIC-PAY-05

required:
  - name: RAZORPAY_PLAN_PRO_MONTHLY
    description: "Razorpay Plan ID for the new PRO tier, monthly billing (human-created in dashboard)"
    example: "plan_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_PLAN_PRO_ANNUAL
    description: "Razorpay Plan ID for PRO, annual billing — price computed via the ×10 standing discount formula, NOT the current codebase's ×12×0.85"
    example: "plan_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_PLAN_AGENCY_MONTHLY
    description: "Razorpay Plan ID for the new AGENCY tier, monthly billing (replaces BROKERAGE in the public plan lineup — different volume, 1000 vs 400/mo, not a rename)"
    example: "plan_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_PLAN_AGENCY_ANNUAL
    description: "Razorpay Plan ID for AGENCY, annual billing"
    example: "plan_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_OFFER_FOUNDING_SOLO
    description: "Razorpay Offer ID for the Founding Customer 100 campaign on SOLO (~27.3% off, human-created in dashboard, linked via offer_id at subscription creation — see US-PAY-108)"
    example: "offer_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_OFFER_FOUNDING_PRO
    description: "Razorpay Offer ID for the Founding Customer 100 campaign on PRO (~27.3% off)"
    example: "offer_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_OFFER_FOUNDING_TEAM
    description: "Razorpay Offer ID for the Founding Customer 100 campaign on TEAM (~31.8% off)"
    example: "offer_..."
    set_in: ".env (local) | Railway env vars (production)"
  - name: RAZORPAY_OFFER_FOUNDING_AGENCY
    description: "Razorpay Offer ID for the Founding Customer 100 campaign on AGENCY (~31.8% off)"
    example: "offer_..."
    set_in: ".env (local) | Railway env vars (production)"

notes:
  - "No new secrets categories — these are Razorpay Plan/Offer IDs, same sensitivity class as the existing RAZORPAY_PLAN_* vars already documented in docs/payments/RAZORPAY_SETUP_GUIDE.md."
  - "PricingCampaign.tierDiscounts (Prisma JSON column, US-PAY-105) stores these offer IDs per campaign — env vars here are only the Founding-100 campaign's initial values; future campaigns (festival, etc.) get their own offer IDs stored as DB rows, not new env vars."
