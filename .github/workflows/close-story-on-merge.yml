# ORION — auto-close-on-merge
# Copies to .github/workflows/close-story-on-merge.yml during `ai-sdlc init`.
# When a PR is merged AND the title/body contains US-{DOMAIN}-{NNN}, runs the
# shell equivalent of /close-story: cascades status to MILESTONE/EPIC/PHASE/AGILE.
# Pure shell + sed/awk — no LLM cost.

name: ORION — Close Story on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  close-story:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Extract story IDs from PR
        id: ids
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY:  ${{ github.event.pull_request.body }}
        run: |
          # A story is "closed by" this PR only if it is named in the TITLE
          # (this repo's convention is "[US-XXX-NNN] ..." or "... — US-XXX-NNN")
          # or on an explicit Closes:/Fixes:/Resolves: line in the body.
          #
          # Scraping the whole body treats every passing mention as a closure.
          # That has misfired repeatedly: PR #20's body discussed US-DESIGN-012
          # only to explain which stale tests were retired, and PR #19/#21
          # mentioned the superseded US-AI-041 purely as context — all three were
          # reported as "closed". Prose is context, not intent.
          TITLE_IDS=$(printf '%s' "$PR_TITLE" | grep -oE 'US-[A-Z]+-[0-9]+' || true)
          BODY_IDS=$(printf '%s' "$PR_BODY" \
            | grep -iE '^[[:space:]]*(closes|fixes|resolves)[[:space:]]*:?[[:space:]]' \
            | grep -oE 'US-[A-Z]+-[0-9]+' || true)
          IDS=$(printf '%s\n%s' "$TITLE_IDS" "$BODY_IDS" \
            | grep -oE 'US-[A-Z]+-[0-9]+' | sort -u | tr '\n' ' ')
          IDS="${IDS%% }"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "Closing: ${IDS:-<none>}"
          echo "(mentions elsewhere in the body are treated as context, not closure)"

      - name: Cascade status updates
        if: steps.ids.outputs.ids != ''
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          IDS: ${{ steps.ids.outputs.ids }}
        run: bash .orion/hooks/cascade-close-story.sh

      - name: Commit cascade
        if: steps.ids.outputs.ids != ''
        run: |
          if [ -n "$(git status --porcelain docs/agile)" ]; then
            git config user.name "orion-bot"
            git config user.email "orion-bot@users.noreply.github.com"
            git add docs/agile
            git commit -m "chore(orion): close ${{ steps.ids.outputs.ids }} after PR #${{ github.event.pull_request.number }} merge"
            git push
          fi
